<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StolPlus - Мебель для комфортной жизни</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .filter-section {
            transition: all 0.3s ease;
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .image-gallery img {
            transition: transform 0.3s ease;
        }
        .image-gallery img:hover {
            transform: scale(1.05);
        }
        .favorite-btn.active {
            color: #ef4444;
        }
        .order-status-new { background-color: #3b82f6; color: white; }
        .order-status-processing { background-color: #f59e0b; color: white; }
        .order-status-completed { background-color: #10b981; color: white; }
        .order-status-cancelled { background-color: #ef4444; color: white; }
        .star-rating .star {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating .star:hover {
            color: #fbbf24;
        }
    </style>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script type="text/babel">
    // ==================== API СЕРВИС ====================
    const apiService = {
        baseURL: 'http://localhost:8090/api',

        async getAllFurniture() {
            try {
                console.log('Загружаем мебель из API...');
                const response = await axios.get(`${this.baseURL}/furniture`);
                console.log('Мебель загружена:', response.data);
                return response.data;
            } catch (error) {
                console.error('Ошибка при загрузке мебели:', error);
                return [];
            }
        }
    };

    // ==================== СИСТЕМА ОТЗЫВОВ ====================
    const reviewService = {
        getReviews() {
            const reviews = localStorage.getItem('stolplus-reviews');
            return reviews ? JSON.parse(reviews) : [];
        },

        getProductReviews(productId) {
            const reviews = this.getReviews();
            return reviews.filter(review => review.productId === productId);
        },

        addReview(reviewData) {
            const reviews = this.getReviews();
            const newReview = {
                id: Date.now(),
                ...reviewData,
                createdAt: new Date().toISOString(),
                likes: 0,
                dislikes: 0
            };
            reviews.push(newReview);
            localStorage.setItem('stolplus-reviews', JSON.stringify(reviews));
            return newReview;
        },

        getProductRating(productId) {
            const reviews = this.getProductReviews(productId);
            if (reviews.length === 0) return 0;

            const total = reviews.reduce((sum, review) => sum + review.rating, 0);
            return Math.round((total / reviews.length) * 10) / 10;
        },

        getUserReview(productId, userId) {
            const reviews = this.getReviews();
            return reviews.find(review => review.productId === productId && review.userId === userId);
        }
    };

    // ==================== СИСТЕМА АВТОРИЗАЦИИ ====================
    const authService = {
        currentUser: null,

        login(email, password, userData = {}) {
            this.currentUser = {
                id: Date.now(),
                email: email,
                name: userData.name || 'Пользователь',
                phone: userData.phone || '+7 (999) 000-00-00',
                address: userData.address || 'Адрес не указан'
            };
            localStorage.setItem('stolplus-user', JSON.stringify(this.currentUser));
            return Promise.resolve(this.currentUser);
        },

        register(email, password, userData) {
            return this.login(email, password, userData);
        },

        logout() {
            this.currentUser = null;
            localStorage.removeItem('stolplus-user');
        },

        getCurrentUser() {
            if (this.currentUser) return this.currentUser;
            const saved = localStorage.getItem('stolplus-user');
            if (saved) {
                this.currentUser = JSON.parse(saved);
            }
            return this.currentUser;
        },

        isAuthenticated() {
            return !!this.getCurrentUser();
        }
    };

    // ==================== СИСТЕМА ЗАКАЗОВ ====================
    const orderService = {
        getOrders() {
            const orders = localStorage.getItem('stolplus-orders');
            return orders ? JSON.parse(orders) : [];
        },

        createOrder(orderData) {
            const orders = this.getOrders();
            const newOrder = {
                id: Date.now(),
                ...orderData,
                createdAt: new Date().toISOString(),
                status: 'new'
            };
            orders.push(newOrder);
            localStorage.setItem('stolplus-orders', JSON.stringify(orders));
            return newOrder;
        },

        updateOrderStatus(orderId, status) {
            const orders = this.getOrders();
            const orderIndex = orders.findIndex(order => order.id === orderId);
            if (orderIndex !== -1) {
                orders[orderIndex].status = status;
                localStorage.setItem('stolplus-orders', JSON.stringify(orders));
            }
        },

        getUserOrders(userId) {
            const orders = this.getOrders();
            return orders.filter(order => order.userId === userId);
        }
    };

    // ==================== КОМПОНЕНТ АВТОРИЗАЦИИ ====================
    function AuthModal({ isOpen, onClose, onLogin }) {
        const [isLogin, setIsLogin] = React.useState(true);
        const [formData, setFormData] = React.useState({
            email: '',
            password: '',
            name: '',
            phone: ''
        });

        const handleSubmit = async (e) => {
            e.preventDefault();
            try {
                let user;
                if (isLogin) {
                    user = await authService.login(formData.email, formData.password);
                } else {
                    user = await authService.register(formData.email, formData.password, {
                        name: formData.name,
                        phone: formData.phone,
                        address: 'Адрес не указан'
                    });
                }
                onLogin(user);
                onClose();
                setFormData({ email: '', password: '', name: '', phone: '' });
            } catch (error) {
                alert('Ошибка авторизации');
            }
        };

        const handleChange = (e) => {
            setFormData(prev => ({
                ...prev,
                [e.target.name]: e.target.value
            }));
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-50 overflow-y-auto">
                <div className="modal-overlay fixed inset-0" onClick={onClose}></div>

                <div className="flex min-h-full items-center justify-center p-4">
                    <div className="relative bg-white rounded-2xl shadow-xl max-w-md w-full">
                        <div className="flex items-center justify-between p-6 border-b">
                            <h2 className="text-2xl font-bold text-gray-900">
                                {isLogin ? 'Вход' : 'Регистрация'}
                            </h2>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 text-2xl p-2 hover:bg-gray-100 rounded-lg transition-colors"
                            >
                                ×
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            {!isLogin && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Имя
                                    </label>
                                    <input
                                        type="text"
                                        name="name"
                                        value={formData.name}
                                        onChange={handleChange}
                                        required
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    />
                                </div>
                            )}

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleChange}
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                />
                            </div>

                            {!isLogin && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Телефон
                                    </label>
                                    <input
                                        type="tel"
                                        name="phone"
                                        value={formData.phone}
                                        onChange={handleChange}
                                        required
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    />
                                </div>
                            )}

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Пароль
                                </label>
                                <input
                                    type="password"
                                    name="password"
                                    value={formData.password}
                                    onChange={handleChange}
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                />
                            </div>

                            <button
                                type="submit"
                                className="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                            >
                                {isLogin ? 'Войти' : 'Зарегистрироваться'}
                            </button>

                            <div className="text-center">
                                <button
                                    type="button"
                                    onClick={() => setIsLogin(!isLogin)}
                                    className="text-blue-600 hover:text-blue-700 text-sm font-medium"
                                >
                                    {isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        );
    }

    // ==================== КОМПОНЕНТ ЛИЧНОГО КАБИНЕТА ====================
    function UserProfileModal({ isOpen, onClose, user, orders, onLogout }) {
        if (!isOpen || !user) return null;

        const userOrders = orders.filter(order => order.userId === user.id);

        const getOrderStatusText = (status) => {
            const statuses = {
                'new': 'Новый',
                'processing': 'В обработке',
                'completed': 'Завершен',
                'cancelled': 'Отменен'
            };
            return statuses[status] || status;
        };

        return (
            <div className="fixed inset-0 z-50 overflow-y-auto">
                <div className="modal-overlay fixed inset-0" onClick={onClose}></div>

                <div className="flex min-h-full items-center justify-center p-4">
                    <div className="relative bg-white rounded-2xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
                        <div className="flex items-center justify-between p-6 border-b">
                            <h2 className="text-2xl font-bold text-gray-900">Личный кабинет</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 text-2xl p-2 hover:bg-gray-100 rounded-lg transition-colors"
                            >
                                ×
                            </button>
                        </div>

                        <div className="overflow-y-auto max-h-[calc(90vh-140px)]">
                            <div className="p-6 space-y-8">
                                {/* Информация о пользователе */}
                                <div>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-4">Личная информация</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Имя</label>
                                            <p className="text-gray-900">{user.name}</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                            <p className="text-gray-900">{user.email}</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Телефон</label>
                                            <p className="text-gray-900">{user.phone}</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Адрес</label>
                                            <p className="text-gray-900">{user.address}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* История заказов */}
                                <div>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-4">История заказов</h3>
                                    {userOrders.length === 0 ? (
                                        <p className="text-gray-600 text-center py-8">Заказов пока нет</p>
                                    ) : (
                                        <div className="space-y-4">
                                            {userOrders.map(order => (
                                                <div key={order.id} className="border border-gray-200 rounded-lg p-4">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <div>
                                                            <h4 className="font-semibold text-gray-900">Заказ #{order.id}</h4>
                                                            <p className="text-sm text-gray-600">
                                                                {new Date(order.createdAt).toLocaleDateString('ru-RU')}
                                                            </p>
                                                        </div>
                                                        <span className={`px-3 py-1 rounded-full text-sm font-medium order-status-${order.status}`}>
                                                            {getOrderStatusText(order.status)}
                                                        </span>
                                                    </div>

                                                    <div className="space-y-2 mb-3">
                                                        {order.items.map(item => (
                                                            <div key={item.id} className="flex justify-between text-sm">
                                                                <span>{item.name}</span>
                                                                <span>{item.quantity} × {item.price.toLocaleString('ru-RU')} ₽</span>
                                                            </div>
                                                        ))}
                                                    </div>

                                                    <div className="flex justify-between items-center border-t pt-3">
                                                        <span className="font-semibold">Итого:</span>
                                                        <span className="font-semibold text-lg">
                                                            {order.totalAmount.toLocaleString('ru-RU')} ₽
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Кнопка выхода */}
                                <div className="border-t pt-6">
                                    <button
                                        onClick={onLogout}
                                        className="w-full bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 transition-colors font-semibold"
                                    >
                                        Выйти из аккаунта
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ==================== КОМПОНЕНТ ОФОРМЛЕНИЯ ЗАКАЗА ====================
    function CheckoutModal({ isOpen, onClose, cartItems, onOrderCreated, user }) {
        const [formData, setFormData] = React.useState({
            name: '',
            email: '',
            phone: '',
            address: '',
            comment: ''
        });

        React.useEffect(() => {
            if (user) {
                setFormData(prev => ({
                    ...prev,
                    name: user.name,
                    email: user.email,
                    phone: user.phone,
                    address: user.address
                }));
            }
        }, [user]);

        const total = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        const handleSubmit = (e) => {
            e.preventDefault();

            const orderData = {
                userId: user ? user.id : null,
                items: cartItems,
                totalAmount: total,
                customerInfo: formData,
                status: 'new'
            };

            const newOrder = orderService.createOrder(orderData);
            onOrderCreated(newOrder);
            onClose();

            setFormData({
                name: '',
                email: '',
                phone: '',
                address: '',
                comment: ''
            });
        };

        const handleChange = (e) => {
            setFormData(prev => ({
                ...prev,
                [e.target.name]: e.target.value
            }));
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-50 overflow-y-auto">
                <div className="modal-overlay fixed inset-0" onClick={onClose}></div>

                <div className="flex min-h-full items-center justify-center p-4">
                    <div className="relative bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-hidden">
                        <div className="flex items-center justify-between p-6 border-b">
                            <h2 className="text-2xl font-bold text-gray-900">Оформление заказа</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 text-2xl p-2 hover:bg-gray-100 rounded-lg transition-colors"
                            >
                                ×
                            </button>
                        </div>

                        <div className="overflow-y-auto max-h-[calc(90vh-140px)]">
                            <form onSubmit={handleSubmit} className="p-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Левая колонка - Товары */}
                                    <div>
                                        <h3 className="text-lg font-semibold text-gray-900 mb-4">Товары в заказе</h3>
                                        <div className="space-y-3 mb-4">
                                            {cartItems.map(item => (
                                                <div key={item.id} className="flex justify-between items-center text-sm">
                                                    <span>{item.name} × {item.quantity}</span>
                                                    <span>{(item.price * item.quantity).toLocaleString('ru-RU')} ₽</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="border-t pt-3">
                                            <div className="flex justify-between font-semibold">
                                                <span>Итого:</span>
                                                <span>{total.toLocaleString('ru-RU')} ₽</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Правая колонка - Форма */}
                                    <div className="space-y-4">
                                        <h3 className="text-lg font-semibold text-gray-900 mb-4">Данные для доставки</h3>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                ФИО *
                                            </label>
                                            <input
                                                type="text"
                                                name="name"
                                                value={formData.name}
                                                onChange={handleChange}
                                                required
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Email *
                                            </label>
                                            <input
                                                type="email"
                                                name="email"
                                                value={formData.email}
                                                onChange={handleChange}
                                                required
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Телефон *
                                            </label>
                                            <input
                                                type="tel"
                                                name="phone"
                                                value={formData.phone}
                                                onChange={handleChange}
                                                required
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Адрес доставки *
                                            </label>
                                            <input
                                                type="text"
                                                name="address"
                                                value={formData.address}
                                                onChange={handleChange}
                                                required
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Комментарий к заказу
                                            </label>
                                            <textarea
                                                name="comment"
                                                value={formData.comment}
                                                onChange={handleChange}
                                                rows="3"
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-6">
                                    <button
                                        type="submit"
                                        className="w-full bg-blue-500 text-white py-4 rounded-lg hover:bg-blue-600 transition-colors font-semibold text-lg"
                                    >
                                        Подтвердить заказ
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ==================== КОМПОНЕНТ ИЗБРАННОГО ====================
    function FavoritesModal({ isOpen, onClose, favorites, onRemoveFavorite, onAddToCart, onViewDetails }) {
        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-50 overflow-y-auto">
                <div className="modal-overlay fixed inset-0" onClick={onClose}></div>

                <div className="flex min-h-full items-center justify-center p-4">
                    <div className="relative bg-white rounded-2xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
                        <div className="flex items-center justify-between p-6 border-b">
                            <h2 className="text-2xl font-bold text-gray-900">Избранное</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 text-2xl p-2 hover:bg-gray-100 rounded-lg transition-colors"
                            >
                                ×
                            </button>
                        </div>

                        <div className="overflow-y-auto max-h-[calc(90vh-140px)] p-6">
                            {favorites.length === 0 ? (
                                <div className="text-center py-12">
                                    <div className="text-gray-300 text-6xl mb-4">❤️</div>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-2">В избранном пока пусто</h3>
                                    <p className="text-gray-600 mb-4">Добавляйте товары в избранное, чтобы не потерять</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-gray-600">
                                            {favorites.length} товаров в избранном
                                        </span>
                                        <button
                                            onClick={() => {
                                                if (confirm('Очистить все избранное?')) {
                                                    favorites.forEach(item => onRemoveFavorite(item.id));
                                                }
                                            }}
                                            className="text-red-600 hover:text-red-700 text-sm font-medium"
                                        >
                                            Очистить все
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {favorites.map(product => (
                                            <div key={product.id} className="flex items-center space-x-4 p-4 border border-gray-200 rounded-lg hover:shadow-md transition-shadow">
                                                <img
                                                    src={product.imageUrl.startsWith('http')
                                                        ? product.imageUrl
                                                        : `http://localhost:8090${product.imageUrl}`}
                                                    alt={product.name}
                                                    className="w-20 h-20 object-cover rounded"
                                                />
                                                <div className="flex-1 min-w-0">
                                                    <h4 className="font-medium text-gray-900 truncate mb-1">
                                                        {product.name}
                                                    </h4>
                                                    <p className="text-blue-600 font-semibold mb-2">
                                                        {product.price?.toLocaleString('ru-RU')} ₽
                                                    </p>
                                                    <div className="flex space-x-2">
                                                        <button
                                                            onClick={() => onAddToCart(product.id)}

    function StarRating({ rating, onRatingChange, readonly = false, size = 'md' }) {
        const sizeClasses = {
            sm: 'text-lg',
            md: 'text-xl',
            lg: 'text-2xl'
        };

        return (
            <div className={`star-rating flex ${sizeClasses[size]} ${readonly ? '' : 'cursor-pointer'}`}>
                {[1, 2, 3, 4, 5].map((star) => (
                    <span
                        key={star}
                        className={`star mx-0.5 ${
                            star <= rating ? 'text-yellow-400' : 'text-gray-300'
                        } ${readonly ? '' : 'hover:text-yellow-300'}`}
                        onClick={() => !readonly && onRatingChange(star)}
                    >
                        ★
                    </span>
                ))}
            </div>
        );
    }

    function useFavorites() {
        const [favorites, setFavorites] = React.useState([]);

        React.useEffect(() => {
            const savedFavorites = localStorage.getItem('stolplus-favorites');
            if (savedFavorites) {
                setFavorites(JSON.parse(savedFavorites));
            }
        }, []);

        React.useEffect(() => {
            localStorage.setItem('stolplus-favorites', JSON.stringify(favorites));
        }, [favorites]);

        const addToFavorites = (product) => {
            setFavorites(prev => {
                if (prev.find(item => item.id === product.id)) {
                    return prev;
                }
                return [...prev, product];
            });
        };

        const removeFromFavorites = (productId) => {
            setFavorites(prev => prev.filter(item => item.id !== productId));
        };

        const toggleFavorite = (product) => {
            if (favorites.find(item => item.id === product.id)) {
                removeFromFavorites(product.id);
            } else {
                addToFavorites(product);
            }
        };

        const isFavorite = (productId) => {
            return favorites.some(item => item.id === productId);
        };

        const clearFavorites = () => {
            setFavorites([]);
        };

        return {
            favorites,
            addToFavorites,
            removeFromFavorites,
            toggleFavorite,
            isFavorite,
            clearFavorites
        };
    }

    // ==================== ХУК ДЛЯ ФИЛЬТРАЦИИ ====================
    function useProductFilter(products, filters) {
        const [filteredProducts, setFilteredProducts] = React.useState([]);

        React.useEffect(() => {
            let filtered = [...products];

            if (filters.search) {
                filtered = filtered.filter(product =>
                    product.name.toLowerCase().includes(filters.search.toLowerCase())
                );
            }

            if (filters.minPrice) {
                filtered = filtered.filter(product => product.price >= parseInt(filters.minPrice));
            }
            if (filters.maxPrice) {
                filtered = filtered.filter(product => product.price <= parseInt(filters.maxPrice));
            }

            if (filters.materials.length > 0) {
                filtered = filtered.filter(product => filters.materials.includes(product.material));
            }

            if (filters.categories.length > 0) {
                filtered = filtered.filter(product => {
                    const productName = product.name.toLowerCase();

                    return filters.categories.some(category => {
                        switch (category) {
                            case 'TABLE':
                                return productName.includes('стол') || productName.includes('table');
                            case 'CHAIR':
                                return productName.includes('стул') || productName.includes('chair') || productName.includes('кресл');
                            case 'SOFA':
                                return productName.includes('диван') || productName.includes('sofa') || productName.includes('кушет');
                            case 'CABINET':
                                return productName.includes('шкаф') || productName.includes('cabinet') || productName.includes('гардероб');
                            case 'BED':
                                return productName.includes('кровать') || productName.includes('bed') || productName.includes('спаль');
                            case 'SHELF':
                                return productName.includes('полка') || productName.includes('shelf') || productName.includes('стеллаж');
                            case 'CHEST':
                                return productName.includes('комод') || productName.includes('chest');
                            default:
                                return true;
                        }
                    });
                });
            }

            filtered.sort((a, b) => {
                switch (filters.sortBy) {
                    case 'name-asc':
                        return a.name.localeCompare(b.name);
                    case 'name-desc':
                        return b.name.localeCompare(a.name);
                    case 'price-asc':
                        return a.price - b.price;
                    case 'price-desc':
                        return b.price - a.price;
                    default:
                        return 0;
                }
            });

            setFilteredProducts(filtered);
        }, [products, filters]);

        return filteredProducts;
    }

            <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
                <Header
                    cartItemsCount={cartItemsCount}
                    onCartClick={() => setIsCartOpen(true)}
                    favoritesCount={favoritesCount}
                    onFavoritesClick={() => setIsFavoritesOpen(true)}
                    user={user}
                    onLoginClick={() => setIsAuthOpen(true)}
                    onProfileClick={() => setIsProfileOpen(true)}
                />
                <HeroSection />

                <section className="py-16 bg-white" id="catalog">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center mb-8">
                            <div>
                                <h2 className="text-3xl font-bold text-gray-900">Каталог мебели</h2>
                                <p className="text-gray-600 mt-2">{filteredProducts.length} товаров из {products.length}</p>
                            </div>
                        </div>

                        <div className="flex flex-col lg:flex-row gap-8">
                            <div className="lg:w-1/4">
                                <FiltersSidebar
                                    filters={filters}
                                    onFilterChange={handleFilterChange}
                                    onResetFilters={handleResetFilters}
                                    products={products}
                                />
                            </div>

                            <div className="lg:w-3/4">
                                {filteredProducts.length === 0 ? (
                                    <div className="text-center py-12">
                                        <div className="text-gray-400 text-6xl mb-4">🔍</div>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-2">Товары не найдены</h3>
                                        <p className="text-gray-600 mb-4">Попробуйте изменить параметры фильтрации</p>
                                        <button
                                            onClick={handleResetFilters}
                                            className="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition-colors"
                                        >
                                            Сбросить фильтры
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                                        {filteredProducts.map(product => (
                                            <ProductCard
                                                key={product.id}
                                                product={product}
                                                onAddToCart={handleAddToCart}
                                                onViewDetails={handleViewProductDetails}
                                                isFavorite={isFavorite(product.id)}
                                                onToggleFavorite={toggleFavorite}
                                                reviews={reviews}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </section>

                {/* Все модалки */}
                <Cart
                    isOpen={isCartOpen}
                    onClose={() => setIsCartOpen(false)}
                    cartItems={cart}
                    onRemoveItem={handleRemoveFromCart}
                    onUpdateQuantity={handleUpdateQuantity}
                    onCheckout={() => setIsCheckoutOpen(true)}
                    user={user}
                />

                <CheckoutModal
                    isOpen={isCheckoutOpen}
                    onClose={() => setIsCheckoutOpen(false)}
                    cartItems={cart}
                    onOrderCreated={handleOrderCreated}
                    user={user}
                />

                <AuthModal
                    isOpen={isAuthOpen}
                    onClose={() => setIsAuthOpen(false)}
                    onLogin={handleLogin}
                />

                <UserProfileModal
                    isOpen={isProfileOpen}
                    onClose={() => setIsProfileOpen(false)}
                    user={user}
                    orders={orders}
                    onLogout={handleLogout}
                />

                <FavoritesModal
                    isOpen={isFavoritesOpen}
                    onClose={() => setIsFavoritesOpen(false)}
                    favorites={favorites}
                    onRemoveFavorite={removeFromFavorites}
                    onAddToCart={handleAddToCart}
                    onViewDetails={handleViewProductDetails}
                />

                <ProductDetailModal
                    product={selectedProduct}
                    isOpen={isProductModalOpen}
                    onClose={handleCloseProductModal}
                    onAddToCart={handleAddToCart}
                    isFavorite={selectedProduct ? isFavorite(selectedProduct.id) : false}
                    onToggleFavorite={toggleFavorite}
                    user={user}
                    reviews={reviews}
                    onReviewAdded={handleReviewAdded}
                />
            </div>
        );
    }

    // Рендерим приложение
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
